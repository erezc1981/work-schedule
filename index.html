<html lang="he" dir="rtl">

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

            theme: {
                extend: {
                    colors: {
                        police: {
                            dark: '#0f172a',
                            navy: '#1e3a8a',

                            gold: '#d97706',
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>

                <div class="flex items-center gap-3">

                        <i class="fa-solid fa-shield-halved text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black tracking-wide">סידור עבודה פיקוח טכנולוגי</h1>

                </div>

                        <i class="fa-brands fa-whatsapp text-sm"></i>

                    </button>
                    <button onclick="openStatsModal()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-chart-pie"></i>

                        <i class="fa-solid fa-lock" id="admin-icon"></i>
                        <span id="admin-btn-text">מצב צפייה</span>
                    </button>
                    <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold py-2 px-3 rounded-lg shadow transition flex items-center gap-1.5">
                        <i class="fa-solid fa-print"></i>
                        <span>הדפסה</span>
                    </button>
                </div>
            </div>
        </header>

                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                        <div class="text-center min-w-[230px] bg-gradient-to-r from-police-navy to-blue-900 text-white px-4 py-2 rounded-2xl shadow-md border-2 border-amber-400/60">
                            <span class="text-[10px] font-bold text-amber-300 block tracking-wider uppercase">✨ שבוע נוכחי ✨</span>
                            <span id="week-range-display" class="font-black text-white text-base tracking-wide">טוען...</span>
                        </div>
                        <button onclick="changeWeek(1)" class="p-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition shadow-sm" title="שבוע הבא">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                    </div>

                                    </th>
                                    <th class="p-3 border-b border-slate-700">
                                        <div>שלישי</div>
                                        <div id="date-2" class="text-[10px] text-blue-200 font-normal">-</div>
                                    </th>
                                    <th class="p-3 border-b border-slate-700">

                                    </th>

                                        <div id="date-6" class="text-[10px] text-amber-300 font-normal">-</div>
                                    </th>
                                </tr>

                                <!-- Populated dynamically -->
                            </tbody>
                        </table>

                </div>

        // Load schedule data from LocalStorage or Fallback to Default
        let scheduleData = JSON.parse(localStorage.getItem('police_schedule_2026')) || defaultScheduleData;

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            populateOfficerFilterOptions();
            renderSchedule();
            renderHolidays();
        });

        function populateOfficerFilterOptions() {
            const select = document.getElementById('officer-filter');
            officers.forEach(off => {
                const opt = document.createElement('option');
                opt.value = off;
                opt.textContent = off;
                select.appendChild(opt);
            });
        }

        function toggleAdminMode() {
            if (!isAdmin) {
                const pwd = prompt('הכנס קוד מנהל/תמיכה:');
                if (pwd === PRIMARY_ADMIN_PWD || pwd === SECONDARY_ADMIN_PWD) {
                    isAdmin = true;
                    const roleText = (pwd === PRIMARY_ADMIN_PWD) ? 'מצב מנהל (ליאור)' : 'מצב תמיכה (1981)';
                    document.getElementById('admin-btn-text').textContent = roleText;
                    document.getElementById('admin-toggle-btn').classList.replace('bg-slate-800', 'bg-amber-500');
                    document.getElementById('admin-toggle-btn').classList.replace('text-amber-400', 'text-slate-900');
                    document.getElementById('admin-icon').classList.replace('fa-lock', 'fa-lock-open');
                } else if (pwd !== null) {
                    alert('סיסמה שגויה!');
                }
            } else {
                isAdmin = false;
                document.getElementById('admin-btn-text').textContent = 'מצב צפייה';
                document.getElementById('admin-toggle-btn').classList.replace('bg-amber-500', 'bg-slate-800');
                document.getElementById('admin-toggle-btn').classList.replace('text-slate-900', 'text-amber-400');
                document.getElementById('admin-icon').classList.replace('fa-lock-open', 'fa-lock');
            }
            renderSchedule();
        }

        function renderSchedule() {
            const currentData = scheduleData[currentWeekIndex] || {
                dates: ['-', '-', '-', '-', '-', '-', '-'],
                shifts: {},
                notes: ''
            };

            // Update Week Display Header
            if (currentData.dates && currentData.dates.length >= 7) {
                document.getElementById('week-range-display').textContent = `${currentData.dates[0]} - ${currentData.dates[6]}`;
                for (let i = 0; i < 7; i++) {
                    document.getElementById(`date-${i}`).textContent = currentData.dates[i] || '-';
                }
            }

            const tbody = document.getElementById('schedule-body');
            tbody.innerHTML = '';

            officers.forEach(officer => {
                const tr = document.createElement('tr');
                const colorConfig = officerRowColors[officer] || { row: 'bg-white', nameBg: 'bg-slate-200 text-slate-800' };
                
                // Dimming or Highlighting based on selected filter
                let focusClass = '';
                if (selectedOfficerFilter !== 'ALL') {
                    if (selectedOfficerFilter === officer) {
                        focusClass = 'focused-row border-2 border-police-navy';
                    } else {
                        focusClass = 'dimmed-row';
                    }
                }

                tr.className = `${colorConfig.row} ${focusClass} hover:opacity-90 transition border-b border-slate-300`;

                let rowHTML = `<td class="p-3 font-extrabold border-l border-slate-300 ${colorConfig.nameBg} text-right shadow-inner">${officer}</td>`;

                const officerShifts = (currentData.shifts && currentData.shifts[officer]) ? currentData.shifts[officer] : ['', '', '', '', '', '', ''];

                for (let day = 0; day < 7; day++) {
                    const shiftVal = officerShifts[day] || '';
                    if (isAdmin) {
                        rowHTML += `
                            <td class="p-1 text-center border-l border-slate-300/60">
                                <div class="flex items-center gap-1">
                                    <input type="text" value="${shiftVal}" 
                                        id="input-${officer}-${day}"
                                        onchange="updateShift('${officer}', ${day}, this.value)"
                                        class="w-full text-center p-1.5 rounded-lg border border-slate-400 text-xs font-bold focus:bg-amber-50 focus:border-amber-400 focus:outline-none shadow-sm">
                                    <button onclick="toggleCarIcon('${officer}', ${day})" 
                                        title="הוסף/הסר רכב" 
                                        class="p-1.5 bg-amber-200 hover:bg-amber-300 text-amber-900 rounded-lg text-xs font-bold transition shadow-sm">
                                        🚗
                                    </button>
                                </div>
                            </td>`;
                    } else {
                        const shiftBadgeClass = getShiftBadgeStyle(shiftVal);
                        rowHTML += `
                            <td class="p-2.5 text-center border-l border-slate-300/60">
                                ${shiftBadgeClass}
                            </td>`;
                    }
                }

                tr.innerHTML = rowHTML;
                tbody.appendChild(tr);
            });

            // Notes input setup
            const nInput = document.getElementById('general-notes');
            nInput.value = currentData.notes || '';
            nInput.readOnly = !isAdmin;
        }

        function toggleCarIcon(officer, dayIndex) {
            if (!scheduleData[currentWeekIndex]) return;
            if (!scheduleData[currentWeekIndex].shifts[officer]) {
                scheduleData[currentWeekIndex].shifts[officer] = ['', '', '', '', '', '', ''];
            }
            let currentVal = scheduleData[currentWeekIndex].shifts[officer][dayIndex] || '';
            
            if (currentVal.includes('רכב')) {
                currentVal = currentVal.replace('רכב', '').trim();
            } else {
                currentVal = (currentVal + ' רכב').trim();
            }
            
            scheduleData[currentWeekIndex].shifts[officer][dayIndex] = currentVal;
            saveDataLocally();
            renderSchedule();
        }

        function getShiftBadgeStyle(val) {
            if (!val) return '<span class="text-slate-400/60 font-normal">-</span>';
            
            const hasCar = val.includes('רכב') || val.toLowerCase().includes('car');
            let cleanVal = val.replace('רכב', '').trim();

            let carBadge = hasCar ? '<span class="bg-amber-500 text-white px-1.5 py-0.5 rounded text-[10px] font-black shadow ml-1">🚗 רכב</span>' : '';

            // Standard Shifts
            if (cleanVal === 'אבג' || cleanVal === 'אב' || cleanVal === 'בג') {
                return `<div class="inline-flex items-center gap-1"><span class="px-2.5 py-1 rounded-lg bg-blue-600 text-white font-bold text-xs shadow">${cleanVal || 'משמרת'}</span>${carBadge}</div>`;
            }
            if (cleanVal === 'א') {
                return `<div class="inline-flex items-center gap-1"><span class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold text-xs shadow">${cleanVal}</span>${carBadge}</div>`;
            }
            // Vacation / Off
            if (cleanVal.includes('חש') || cleanVal.includes('ח״ש') || cleanVal.includes('חופש')) {
                return `<div class="inline-flex items-center gap-1"><span class="px-2.5 py-1 rounded-lg bg-amber-200 text-amber-900 font-bold text-xs border border-amber-400 shadow-sm">${cleanVal}</span>${carBadge}</div>`;
            }
            // Sick
            if (cleanVal.includes('מחלה')) {
                return `<div class="inline-flex items-center gap-1"><span class="px-2.5 py-1 rounded-lg bg-rose-600 text-white font-bold text-xs shadow">${cleanVal}</span>${carBadge}</div>`;
            }
            // Special
            if (cleanVal.includes('אילת') || cleanVal.includes('כנס') || cleanVal.includes('מטווח')) {
                return `<div class="inline-flex items-center gap-1"><span class="px-2.5 py-1 rounded-lg bg-purple-600 text-white font-bold text-xs shadow">${cleanVal}</span>${carBadge}</div>`;
            }

            // Fallback default badge if only car or other text
            if (!cleanVal && hasCar) {
                return carBadge;
            }

            return `<div class="inline-flex items-center gap-1"><span class="px-2.5 py-1 rounded-lg bg-slate-700 text-white font-bold text-xs shadow">${cleanVal}</span>${carBadge}</div>`;
        }

        function updateShift(officer, dayIndex, val) {
            if (!scheduleData[currentWeekIndex]) return;
            if (!scheduleData[currentWeekIndex].shifts[officer]) {
                scheduleData[currentWeekIndex].shifts[officer] = ['', '', '', '', '', '', ''];
            }
            scheduleData[currentWeekIndex].shifts[officer][dayIndex] = val;
            saveDataLocally();
        }

        function saveNotes() {
            if (!scheduleData[currentWeekIndex]) return;
            scheduleData[currentWeekIndex].notes = document.getElementById('general-notes').value;
            saveDataLocally();
        }

        function saveDataLocally() {
            localStorage.setItem('police_schedule_2026', JSON.stringify(scheduleData));
        }

        function filterOfficer() {
            selectedOfficerFilter = document.getElementById('officer-filter').value;
            renderSchedule();
        }

        function handleSearch() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            if (!query) return;

            // Search by date or officer across all weeks
            for (let wIndex = 0; wIndex < scheduleData.length; wIndex++) {
                const week = scheduleData[wIndex];
                const matchDate = week.dates.some(d => d.toLowerCase().includes(query));
                if (matchDate) {
                    currentWeekIndex = wIndex;
                    renderSchedule();
                    break;
                }
            }
        }

        function shareToWhatsApp() {
            const currentData = scheduleData[currentWeekIndex];
            if (!currentData) return;

            const days = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
            let text = `🚔 *סידור עבודה - פיקוח טכנולוגי*\n📅 *שבוע:* ${currentData.dates[0]} - ${currentData.dates[6]}\n\n`;

            officers.forEach(off => {
                const shifts = currentData.shifts[off] || [];
                let shiftText = '';
                shifts.forEach((s, i) => {
                    if (s) shiftText += `${days[i]}: ${s} | `;
                });
                if (shiftText) {
                    text += `👤 *${off}:* ${shiftText.slice(0, -3)}\n`;
                }
            });

            if (currentData.notes) {
                text += `\n📌 *הערות:* ${currentData.notes}\n`;
            }

            text += `\n🔗 לצפייה מלאה: https://erezc1981.github.io/work-schedule/`;

            const encoded = encodeURIComponent(text);
            window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
        }

        function openStatsModal() {
            const container = document.getElementById('stats-modal-content');
            container.innerHTML = '';

            let totalShifts = {};
            officers.forEach(o => totalShifts[o] = { shifts: 0, car: 0, vacation: 0, sick: 0 });

            scheduleData.forEach(week => {
                officers.forEach(o => {
                    const shifts = week.shifts[o] || [];
                    shifts.forEach(s => {
                        if (!s) return;
                        totalShifts[o].shifts++;
                        if (s.includes('רכב')) totalShifts[o].car++;
                        if (s.includes('חש') || s.includes('חופש')) totalShifts[o].vacation++;
                        if (s.includes('מחלה')) totalShifts[o].sick++;
                    });
                });
            });

            let html = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
            officers.forEach(o => {
                const stats = totalShifts[o];
                const colorConfig = officerRowColors[o] || { nameBg: 'bg-slate-200' };
                html += `
                    <div class="p-3 rounded-xl border border-slate-200 bg-slate-50 flex flex-col justify-between">
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-extrabold text-sm px-2.5 py-0.5 rounded ${colorConfig.nameBg}">${o}</span>
                            <span class="text-xs font-bold text-slate-500">סה"כ משמרות: ${stats.shifts}</span>
                        </div>
                        <div class="grid grid-cols-3 gap-1 text-center text-[11px] font-bold">
                            <div class="bg-amber-100 text-amber-900 p-1.5 rounded-lg">🚗 רכב: ${stats.car}</div>
                            <div class="bg-amber-50 text-amber-800 p-1.5 rounded-lg">🏖️ חופש: ${stats.vacation}</div>
                            <div class="bg-rose-100 text-rose-900 p-1.5 rounded-lg">🤒 מחלה: ${stats.sick}</div>
                        </div>
                    </div>`;
            });
            html += `</div>`;

            container.innerHTML = html;
            document.getElementById('stats-modal').classList.remove('hidden');
        }

        function closeStatsModal() {
            document.getElementById('stats-modal').classList.add('hidden');
        }

        function renderHolidays() {
            const tbody = document.getElementById('holidays-body');
            tbody.innerHTML = '';
            holidaysData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-3 font-bold text-police-navy">${item.name}</td>
                    <td class="p-3 text-slate-600 font-medium">${item.date}</td>
                    <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-lg font-bold text-xs">${item.eve}</span></td>
                    <td class="p-3"><span class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded-lg font-bold text-xs">${item.day}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function changeWeek(direction) {
            if (currentWeekIndex + direction >= 0 && currentWeekIndex + direction < scheduleData.length) {
                currentWeekIndex += direction;
                renderSchedule();
            }
        }

        function switchTab(tab) {
            if (tab === 'schedule') {
                document.getElementById('view-schedule').classList.remove('hidden');
                document.getElementById('view-holidays').classList.add('hidden');
                document.getElementById('tab-schedule').className = 'py-2 px-3 rounded-lg bg-white shadow-sm text-police-navy';
                document.getElementById('tab-holidays').className = 'py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900';
            } else {
                document.getElementById('view-schedule').classList.add('hidden');
                document.getElementById('view-holidays').classList.remove('hidden');
                document.getElementById('tab-holidays').className = 'py-2 px-3 rounded-lg bg-white shadow-sm text-police-navy';
                document.getElementById('tab-schedule').className = 'py-2 px-3 rounded-lg text-slate-600 hover:text-slate-900';
            }
        }
    </script>
</body>
</html>
